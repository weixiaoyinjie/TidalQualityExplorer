
name: Build TIDAL Quality Explorer APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extract source ZIP
        shell: bash
        run: |
          if [ -f settings.gradle ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            FILE=$(find . -maxdepth 2 -name 'TidalQualityExplorer*.zip' -type f | head -n 1)
            if [ -z "$FILE" ]; then
              echo "Source ZIP not found"
              exit 1
            fi
            mkdir -p extracted
            unzip -q "$FILE" -d extracted
            SETTINGS=$(find extracted -name settings.gradle -type f | head -n 1)
            if [ -z "$SETTINGS" ]; then
              echo "settings.gradle not found"
              exit 1
            fi
            DIR=$(dirname "$SETTINGS")
            echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        shell: bash
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TidalQualityExplorer-v1.0.0-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
