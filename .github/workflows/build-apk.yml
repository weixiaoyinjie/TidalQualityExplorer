
name: Build TIDAL Quality Explorer APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android SDK 35
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -n "$ANDROID_HOME" || {
            echo "Android SDK is missing"
            exit 1
          }

          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || \
             [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            sdkmanager --install \
              'platforms;android-35' \
              'build-tools;35.0.0'
          fi

      - name: Locate and unzip project
        shell: bash
        run: |
          if [ -f settings.gradle ]; then
            echo 'PROJECT_DIR=.' >> "$GITHUB_ENV"
          else
            ZIP=$(find . -maxdepth 2 -type f \
              -name 'TidalQualityExplorer*.zip' \
              -print -quit)

            if [ -z "$ZIP" ]; then
              echo "Source ZIP not found"
              exit 1
            fi

            mkdir -p extracted
            unzip -q "$ZIP" -d extracted

            SETTINGS=$(find extracted -type f \
              -name settings.gradle -print -quit)

            if [ -z "$SETTINGS" ]; then
              echo "settings.gradle not found"
              exit 1
            fi

            echo "PROJECT_DIR=$(dirname "$SETTINGS")" \
              >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        shell: bash
        run: |
          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            :app:assembleDebug \
            --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TidalQualityExplorer-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
